# Konfigurasi Docker Compose untuk proyek SADEWA
# Terdiri dari 3 layanan: PostgreSQL, Backend FastAPI, dan AI Service (RAG + Qwen)

services:
  # Layanan database PostgreSQL
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sadewa
      POSTGRES_PASSWORD: sadewa_dev
      POSTGRES_DB: sadewa_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sadewa"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Layanan backend FastAPI
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sadewa:sadewa_dev@postgres:5432/sadewa_db
    env_file:
      - ./backend/.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      # Mount kode sumber untuk hot-reload saat pengembangan
      - ./backend:/app

  # Layanan AI (RAG + Qwen)
  ai-service:
    build:
      context: ./ai
    ports:
      - "8001:8001"
    env_file:
      - ./ai/.env
    command: uvicorn sadewa_ai.api:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      # Mount kode sumber untuk hot-reload saat pengembangan
      - ./ai:/app
      # Mount direktori vectorstore secara terpisah
      - ./ai/vectorstore:/app/vectorstore

# Definisi volume untuk persistensi data
volumes:
  pgdata:
